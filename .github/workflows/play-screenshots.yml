# One click replaces the Google Play screenshots (phone, 7-inch and 10-inch tablets) in every
# language the Play listing has.
#
# Same sources as "App Store screenshots": appstore/screenshots/render-store.cjs --android draws
# the Play variant (9:16 phone panels, no anti-scroll panel, reviews signed without a store
# name), then scripts/play_screenshots.py replaces the three slots in one edit and commits it.
# Languages without a Play listing are skipped. The PNGs are attached to the run as
# "play-assets".
#
#   push      render, upload, commit. The default.
#   dry-run   render, attach the artifact, list what would be replaced. Writes nothing.
#
# Secret: PLAY_SERVICE_ACCOUNT_JSON (as for "Pricing tests"). The service account needs the
# permission to edit the store listing in the Play Console.
name: Google Play screenshots

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: push
        options:
          - push
          - dry-run
      locale:
        description: "One locale only, e.g. fr-FR (blank = all)"
        type: string
        default: ""

# Two runs never edit the listing at once.
concurrency:
  group: play-listing
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secret is set
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret: PLAY_SERVICE_ACCOUNT_JSON" >&2
            echo "Settings -> Secrets and variables -> Actions -> New repository secret" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the JWT signer
        run: pip install --quiet pyjwt cryptography

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The fonts the pages fall back to for Greek, Cyrillic, Arabic, Hebrew and Japanese, and
      # Inter for the status bar clock. Without them those languages render as boxes.
      - name: Install fonts and the browser
        working-directory: appstore/screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-inter
          npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium

      # Inputs go through the environment, never spliced into the script.
      - name: Render
        working-directory: appstore/screenshots
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          if [ -n "$LOCALE" ]; then
            node render-store.cjs --android "$LOCALE"
          else
            node render-store.cjs --android
          fi

      - name: Attach the rendered assets
        uses: actions/upload-artifact@v4
        with:
          name: play-assets
          path: |
            appstore/screenshots/*/play-phone/
            appstore/screenshots/*/play-tablet/
          retention-days: 14

      - name: Screenshots
        env:
          ACTION: ${{ inputs.action }}
          LOCALE: ${{ inputs.locale }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          only=()
          if [ -n "$LOCALE" ]; then
            only=(--locale "$LOCALE")
          fi
          case "$ACTION" in
            dry-run) mode=(--dry-run) ;;
            push)    mode=() ;;
            *)       echo "unknown action: $ACTION" >&2; exit 1 ;;
          esac
          {
            echo "### \`$ACTION\`: Google Play screenshots"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 scripts/play_screenshots.py push "${mode[@]}" "${only[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
