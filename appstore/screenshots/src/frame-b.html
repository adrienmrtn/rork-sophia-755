<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia — App Store frame, editorial set</title>
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("../../../ios/Sophia/Resources/Fonts/PlusJakartaSans.ttf") format("truetype");
  font-weight: 200 800;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: 100vw; height: 100vh; overflow: hidden; position: relative;
  font-family: "Plus Jakarta Sans", sans-serif; -webkit-font-smoothing: antialiased;
  background: #fef5e9; color: #17181c;
}

/* ---- Feature panels: title + subtitle on the left, flat outlined phone bleeding off the bottom ---- */
.text { position: absolute; left: 30px; right: 26px; top: 58px; }
.text h1 { margin: 0; font-weight: 800; font-size: 34px; line-height: 1.14; letter-spacing: -0.03em; }
.text p { margin: 11px 0 0; font-size: 18.5px; line-height: 1.3; font-weight: 500; color: #3d3f47; letter-spacing: -0.01em; }

.phone {
  position: absolute; left: 50%; top: 206px;
  --s: 0.8; --line: 3.5px;
  width: calc(440px * var(--s) + 2 * var(--line)); height: calc(956px * var(--s) + 2 * var(--line));
  transform: translateX(-50%);
  border: var(--line) solid #111216; border-radius: calc(44px * var(--s) + var(--line));
  background: #fff; overflow: hidden;
}
.phone iframe { width: 440px; height: 956px; border: 0; display: block; transform: scale(var(--s)); transform-origin: 0 0; }

/* ---- Hero panel ---- */
body.hero { background: #dc6048; color: #fff; }
body.hero .phone, body.hero .text { display: none; }
.hero-only { display: none; }
body.hero .hero-only { display: block; }
.logo { position: absolute; left: 30px; top: 60px; height: 34px; }
.hero-text { position: absolute; left: 30px; right: 30px; top: 150px; }
.hero-text h1 { margin: 0; font-weight: 800; font-size: 50px; line-height: 1.08; letter-spacing: -0.035em; }
.hero-text p { margin: 18px 0 0; font-size: 22px; line-height: 1.3; font-weight: 500; opacity: 0.96; }
.art {
  position: absolute; left: -92px; bottom: 36px; width: 624px; height: 468px;
  background: url("../../../web/public/art/hero.webp") center / cover;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 72%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 72%, transparent 100%);
}
</style>
</head>
<body>
<div class="hero-only">
  <img class="logo" src="../../../ios/Sophia/Assets.xcassets/logo_white.imageset/logo_white.png" alt="Sophia">
  <div class="hero-text"><h1 id="hh"></h1><p id="hp"></p></div>
  <div class="art"></div>
</div>
<div class="text"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><iframe id="f"></iframe></div>
<script src="shots.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const locale = q.get("locale") || "fr-FR";
  const shot = SETS.editorial.shots[Number(q.get("i") || 0)];
  const copy = (SETS.editorial.copy[locale] || SETS.editorial.copy["fr-FR"])[shot.screen];
  document.documentElement.lang = locale.slice(0, 2);
  if (shot.screen === "hero") {
    document.body.className = "hero";
    document.getElementById("hh").innerHTML = copy[0];
    document.getElementById("hp").innerHTML = copy[1];
  } else {
    document.getElementById("h").innerHTML = copy[0];
    document.getElementById("p").innerHTML = copy[1];
    document.getElementById("f").src = "screens/" + shot.screen + ".html";
  }
</script>
</body>
</html>
