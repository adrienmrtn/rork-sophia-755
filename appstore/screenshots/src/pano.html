<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia — App Store panorama</title>
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("../../../ios/Sophia/Resources/Fonts/PlusJakartaSans.ttf") format("truetype");
  font-weight: 200 800;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
/* One wide canvas, 440 pt per App Store panel; render-pano.cjs cuts it into panels. */
body { height: 956px; overflow: hidden; position: relative; font-family: "Plus Jakarta Sans", "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans CJK JP", sans-serif; -webkit-font-smoothing: antialiased; }
body.rtl .text, body.rtl .bubble, body.rtl .review, body.rtl .prof { direction: rtl; }
.panel { position: absolute; top: 0; width: 440px; height: 956px; overflow: hidden; }
.panel.cream { background: #fef5e9; color: #17181c; --sub: #3d3f47; }
.panel.coral { background: #dc6048; color: #fff; --sub: #fff; }
.panel.navy  { background: #1a3a6b; color: #fff; --sub: #e6ecf7; }
.panel.sun   { background: #f2b134; color: #17181c; --sub: #2b2a26; }
.panel.pink  { background: #f4a3c4; color: #17181c; --sub: #33262d; }
.panel.blue  { background: #2e62c4; color: #fff; --sub: #eaf0fb; }
.text { position: absolute; left: 30px; right: 26px; top: 58px; z-index: 5; }
.panel.pale  { background: #f3f5fb; color: #17181c; --sub: #2f323a; }
.text.center { text-align: center; left: 24px; right: 24px; top: 56px; }
.text.center h1 { font-size: 29px; line-height: 1.2; letter-spacing: -0.025em; }
.text.center p { margin-top: 8px; font-weight: 400; }
/* Sets with `titles: "loud"`: bigger, heavier headlines (800 is the font's heaviest cut, so a
   hairline stroke in the text colour thickens it further). */
body.loud .text.center { top: 42px; left: 14px; right: 14px; }
body.loud .text.center h1 { font-size: 46px; line-height: 1.08; letter-spacing: -0.035em; -webkit-text-stroke: 0.9px currentColor; }
body.loud .text.center h1 b { font-size: 1.28em; line-height: 1; }
body.loud .text.center p { margin-top: 10px; font-size: 22px; line-height: 1.22; font-weight: 500; text-wrap: balance; }
body.loud .bubble { font-size: 43px; line-height: 1.1; -webkit-text-stroke: 0.8px currentColor; padding: 20px 26px 24px; }
body.loud .reviews { top: 196px; gap: 14px; }
body.loud .review { padding: 18px 16px 16px; }
body.loud .review q { font-size: 20px; line-height: 1.32; }
body.loud .review .who { font-size: 15px; }
body.loud .profs { top: 228px; }
body.loud .prof .n { font-size: 20.5px; }
body.loud .prof .c { font-size: 16px; }
.text.center h1 b { font-size: 1.55em; line-height: 0.9; letter-spacing: -0.04em; }
/* Hero of the "vitrine" set: big logo and a speech bubble */
.logo.big { left: 36px; top: 392px; height: 66px; }
.bubble { position: absolute; left: 36px; top: 486px; width: auto; padding: 20px 26px 22px; border-radius: 14px;
  background: #234fa6; color: #fff; font-weight: 800; font-size: 31px; line-height: 1.16; letter-spacing: -0.02em; z-index: 5; }
.bubble::after { content: ""; position: absolute; left: 96px; bottom: -30px; border: 16px solid transparent; border-top-color: #234fa6; border-left-color: #234fa6; }
/* Thick coloured phone frame with a pale inner band and side buttons */
.phone.thick { border: 4.5px solid var(--frame); padding: 6px; background: var(--band); box-shadow: none; overflow: visible;
  width: calc(440px * var(--s) + 21px); height: calc(956px * var(--s) + 21px); border-radius: calc(44px * var(--s) + 12px); }
.phone.thick .scr { width: calc(440px * var(--s)); height: calc(956px * var(--s)); overflow: hidden; border-radius: calc(44px * var(--s)); background: #fff; }
.phone.thick::before, .phone.thick::after { content: ""; position: absolute; width: 5px; background: var(--frame); border-radius: 3px; }
.phone.thick::before { left: -8px; top: 92px; height: 26px; box-shadow: 0 46px 0 var(--frame), 0 82px 0 var(--frame); }
.phone.thick::after { right: -8px; top: 150px; height: 70px; }
/* Opening on cream with the colour logo (pink mark, black wordmark) */
.logo.brand { left: 34px; top: 268px; height: 78px; }
.panel.cream .bubble { background: #2e62c4; top: 368px; }
.panel.cream .bubble::after { border-top-color: #2e62c4; border-left-color: #2e62c4; }
.profs { position: absolute; left: 24px; right: 24px; top: 196px; display: flex; flex-direction: column; gap: 14px; z-index: 4; }
.prof { background: #fff; border-radius: 20px; border: 1.5px solid #dfe4ee; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.prof img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; flex: none; }
.prof .n { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: #17181c; display: flex; align-items: center; gap: 6px; }
.prof .c { margin-top: 4px; font-size: 14px; line-height: 1.32; color: #5b6170; font-weight: 500; }
.tile { position: absolute; width: 150px; height: 150px; border-radius: 20px; object-fit: cover; z-index: 1; }
.extra { position: absolute; z-index: 6; }
.reviews { position: absolute; left: 26px; right: 26px; top: 176px; display: flex; flex-direction: column; gap: 16px; z-index: 4; }
.review { background: #fff; border-radius: 18px; border: 1.5px solid #dfe4ee; padding: 20px 20px 18px; text-align: center; }
.review .stars { display: flex; justify-content: center; gap: 4px; margin-bottom: 12px; }
.review q { display: block; quotes: none; font-size: 17.5px; line-height: 1.38; font-weight: 500; color: #22262e; }
.review .who { margin-top: 10px; font-size: 13.5px; color: #6b7280; font-weight: 500; }
.text.right { text-align: right; left: 26px; right: 30px; }
.text h1 { margin: 0; font-weight: 800; font-size: 34px; line-height: 1.14; letter-spacing: -0.03em; }
.text p { margin: 11px 0 0; font-size: 18.5px; line-height: 1.3; font-weight: 500; color: var(--sub); letter-spacing: -0.01em; }
.text.big h1 { font-size: 48px; line-height: 1.08; letter-spacing: -0.035em; }
.text.big p { font-size: 21px; margin-top: 16px; }
.text.big { top: 140px; }
.logo { position: absolute; left: 30px; top: 58px; height: 34px; z-index: 5; }
.phone {
  position: absolute; --line: 3.5px; z-index: 2;
  width: calc(440px * var(--s) + 2 * var(--line)); height: calc(956px * var(--s) + 2 * var(--line));
  border: var(--line) solid #111216; border-radius: calc(44px * var(--s) + var(--line));
  background: #fff; overflow: hidden;
  box-shadow: 0 18px 40px -18px rgba(20, 20, 30, 0.35);
}
.phone iframe { width: 440px; height: 956px; border: 0; display: block; transform: scale(var(--s)); transform-origin: 0 0; }
.person { position: absolute; z-index: 3; transform-origin: 50% 100%; }
</style>
</head>
<body>
<script src="copy.js"></script>
<script src="pano.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const V = PANOS[q.get("v") || "penche"];
  const locale = q.get("locale") || "fr-FR";
  const T = V.copy[locale] || Object.values(V.copy)[0];
  const Q = V.lang ? "?lang=" + V.lang : "";   // language of the app screens inside the phones
  document.body.style.width = V.panels.length * 440 + "px";
  if (V.titles) document.body.classList.add(V.titles);
  V.panels.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "panel " + p.theme; el.style.left = i * 440 + "px";
    let html = p.logo === "brand" ? `<img class="logo brand" src="../../../web/public/brand/sophia-logo.png">`
      : p.logo ? `<img class="logo ${p.logo === "big" ? "big" : ""}" src="../../../ios/Sophia/Assets.xcassets/logo_white.imageset/logo_white.png">` : "";
    if (p.text) { const [h, sub] = T[p.text]; html += `<div class="text ${p.cls || ""}"><h1>${h}</h1>${sub ? `<p>${sub}</p>` : ""}</div>`; }
    if (p.bubble) html += `<div class="bubble">${T[p.bubble][0]}</div>`;
    (p.grid || []).forEach((row, r) => row.forEach((f, c) => {
      html += `<img class="tile" src="../../../ios/Sophia/CourseImages/${f}.jpg" style="left:${c * 166 - (r % 2 ? 98 : 22)}px; top:${(V.titles ? 212 : 178) + r * 166}px">`;
    }));
    if (p.profs) {
      const check = '<svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2e62c4"/><path d="M7 12.500l3.300 3.300L17 9" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      html += `<div class="profs">${T[p.profs].map(([name, cred, av]) => `<div class="prof"><img src="../../../web/public/avatars/${av}.webp"><div><div class="n">${name}${check}</div><div class="c">${cred}</div></div></div>`).join("")}</div>`;
    }
    if (p.reviews) {
      const star = '<svg width="19" height="19" viewBox="0 0 24 24"><path fill="#f2a31b" d="M12 1.800l3.100 6.600 7.100.900-5.200 5 1.300 7.100L12 18l-6.300 3.400 1.300-7.100-5.200-5 7.100-.900L12 1.800Z"/></svg>';
      html += `<div class="reviews">${T[p.reviews].map(([quote, who, n]) => `<div class="review"><div class="stars">${star.repeat(n || 5)}</div><q>${quote}</q><div class="who">${who}</div></div>`).join("")}</div>`;
    }
    el.innerHTML = html; document.body.appendChild(el);
  });
  (V.extras || []).forEach((x) => {
    const el = document.createElement("div"); el.className = "extra"; el.style.left = x.x + "px"; el.style.top = x.y + "px"; if (x.z !== undefined) el.style.zIndex = x.z; el.innerHTML = x.html; document.body.appendChild(el);
  });
  // phones: cx, cy = centre on the wide canvas; s = scale; r = rotation in degrees
  V.phones.forEach((p) => {
    const el = document.createElement("div"); el.className = "phone"; el.style.setProperty("--s", p.s);
    const thick = !!p.frame, w = 440 * p.s + (thick ? 21 : 7), h = 956 * p.s + (thick ? 21 : 7);
    if (thick) { el.classList.add("thick"); el.style.setProperty("--frame", p.frame); el.style.setProperty("--band", p.band); }
    el.style.left = p.cx - w / 2 + "px"; el.style.top = p.cy - h / 2 + "px"; el.style.transform = `rotate(${p.r || 0}deg)`;
    el.innerHTML = thick ? `<div class="scr"><iframe src="screens/${p.screen}.html${Q}"></iframe></div>` : `<iframe src="screens/${p.screen}.html${Q}"></iframe>`; document.body.appendChild(el);
  });
  // people: x = centre, b = y of the feet, h = height; r = rotation; flip; z
  V.people.forEach((p) => {
    const el = document.createElement("img"); el.className = "person"; el.src = `people/${p.name}.png`;
    el.style.height = p.h + "px"; el.style.zIndex = p.z || 3;
    el.onload = () => { const w = el.naturalWidth * p.h / el.naturalHeight; el.style.left = p.x - w / 2 + "px"; };
    el.style.top = p.b - p.h + "px"; el.style.transform = `rotate(${p.r || 0}deg) scaleX(${p.flip ? -1 : 1})`;
    document.body.appendChild(el);
  });
  const MARGIN = 25;
  // Big headlines must fit whatever the language: keep each <br> line on one line and shrink the
  // type until it does; a subtitle may take two lines, then shrinks too.
  function fitText() {
    document.querySelectorAll(".text h1").forEach((h) => {
      h.style.whiteSpace = "nowrap";
      let size = parseFloat(getComputedStyle(h).fontSize);
      while (h.scrollWidth > h.clientWidth + 0.5 && size > 22) { size -= 1; h.style.fontSize = size + "px"; }
    });
    document.querySelectorAll(".text p").forEach((p) => {
      let size = parseFloat(getComputedStyle(p).fontSize);
      const lines = () => p.getBoundingClientRect().height / parseFloat(getComputedStyle(p).lineHeight);
      while (lines() > 2.2 && size > 14) { size -= 0.5; p.style.fontSize = size + "px"; }
    });
    // Review cards must end above the bottom edge (or the character under them): shrink the quotes.
    document.querySelectorAll(".reviews").forEach((r) => {
      const top = r.parentElement.getBoundingClientRect().top;
      let size = parseFloat(getComputedStyle(r.querySelector("q")).fontSize);
      while (r.getBoundingClientRect().bottom - top > 800 && size > 13) {
        size -= 0.5; r.querySelectorAll("q").forEach((q) => { q.style.fontSize = size + "px"; });
      }
    });
    document.querySelectorAll(".bubble").forEach((b) => {
      b.style.whiteSpace = "nowrap";
      const room = b.parentElement.getBoundingClientRect().width - 2 * MARGIN;
      let size = parseFloat(getComputedStyle(b).fontSize);
      while (b.getBoundingClientRect().width > room && size > 22) { size -= 1; b.style.fontSize = size + "px"; }
    });
  }
  if (["ar", "he"].includes(V.lang)) document.body.classList.add("rtl");
  document.documentElement.lang = V.lang || "fr";
  window.fitted = V.titles ? document.fonts.ready.then(fitText) : Promise.resolve();
</script>
</body>
</html>
