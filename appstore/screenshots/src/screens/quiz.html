<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia · quiz</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* QuizView.questionView (ios/Sophia/Views/QuizView.swift) drawn with the pieces of
     CourseElevateKit.swift: CourseQuizTopBar, CourseQuizQuestionHeader,
     CourseQuizOptionCard (dsOptionCard), CourseQuizVerdictPanel. */
  :root {
    --success-ink: #1f4d36;   /* CoursePalette.successInk */
    --gold-deep: #b17f10;     /* CoursePalette.goldDeep */
    --gold-tint: #fbefc9;     /* CoursePalette.goldTint */
    --gold-ink: #6b4e00;      /* CoursePalette.goldInk */
    --lh: 1.26em;             /* natural line height of Plus Jakarta Sans */
  }
  .screen {
    position: absolute; inset: 0; padding-top: var(--safe-top);
    display: flex; flex-direction: column; background: var(--canvas);
  }

  /* CourseQuizTopBar: HStack(spacing 12), padding h24 / top 10 / bottom 4 */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px 4px; flex: none; }
  .round-icon {               /* CourseRoundIcon, 44 pt, 1 pt hairline */
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: var(--surface); border: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .segments { flex: 1; display: flex; gap: 4px; }      /* DSSegmentedProgress */
  .segments i { flex: 1; height: 6px; border-radius: 3px; background: rgba(218, 221, 226, .75); }
  .segments i.on { background: var(--accent); }
  .pill-gold {                /* CourseQuizComboPill */
    flex: none; display: flex; align-items: center; gap: 4px; padding: 5px 10px;
    background: var(--gold-tint); border-radius: 12px;
    font-size: 13px; font-weight: 800; line-height: var(--lh); color: var(--gold-ink);
    font-variant-numeric: tabular-nums;
  }

  /* ScrollView content: VStack(spacing 26), padding h24, header top 26 */
  .content { flex: 1; min-height: 0; padding: 26px 24px 32px; display: flex; flex-direction: column; gap: 26px; }
  .header { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .eyebrow { display: flex; align-items: center; gap: 6px; }
  .eyebrow img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  .eyebrow span {
    font-size: 12px; font-weight: 800; letter-spacing: .8px; line-height: var(--lh);
    color: var(--accent); text-transform: uppercase;
  }
  .question {                 /* 26 pt regular (question ≤ 70 characters), lineSpacing 4 */
    margin: 0; font-size: 26px; font-weight: 400; line-height: calc(var(--lh) + 4px);
    text-align: center; color: var(--ink);
  }

  /* CourseQuizOptionCard + dsOptionCard */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 12px 16px;
    border-radius: 16px; background: var(--surface);
    border: 1.5px solid var(--hairline); box-shadow: 0 1.5px 0 var(--hairline);
    font-size: 15px; font-weight: 600; line-height: calc(var(--lh) + 2px); color: var(--ink);
  }
  .option span { flex: 1; }
  .option.dimmed {
    color: var(--ink-secondary); opacity: .6; transform: scale(.99);
    border-color: rgba(218, 221, 226, .7); box-shadow: 0 1.5px 0 rgba(218, 221, 226, .7);
  }
  .option.correct {
    background: var(--success-tint); border-color: var(--success); box-shadow: 0 1.5px 0 var(--success);
    color: var(--success-ink); font-weight: 700;
  }
  .check-badge { width: 26px; height: 26px; flex: none; display: block; }

  /* CourseQuizVerdictPanel: padding h24 / top 18 / bottom 16, VStack(spacing 8),
     top corners 24, only the top hairline visible, fill runs under the home indicator */
  .verdict {
    flex: none; margin: 0 -1.5px; padding: 18px 24px calc(16px + var(--safe-bottom));
    background: var(--surface); border: 1.5px solid var(--hairline); border-bottom: 0;
    border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 8px;
  }
  .verdict-head { display: flex; align-items: center; gap: 10px; }
  .verdict-icon {
    width: 32px; height: 32px; border-radius: 50%; background: var(--success-tint); flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .verdict-title { flex: 1; font-size: 19px; font-weight: 700; line-height: var(--lh); color: var(--success-ink); }
  .xp {
    flex: none; padding: 4px 10px; border-radius: 12px; background: var(--accent-tint);
    font-size: 13px; font-weight: 700; line-height: var(--lh); color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .combo { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: var(--lh); color: var(--gold-ink); }
  .explanation { margin: 0; font-size: 15px; font-weight: 400; line-height: calc(var(--lh) + 3px); color: var(--ink-secondary); }
  .cta {                      /* DSPrimaryButtonStyle, padding top 8 */
    margin-top: 8px; padding: 17px 12px; border-radius: 16px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 17px; font-weight: 600; line-height: var(--lh);
  }
  svg { display: block; }

  /* Arabic and Hebrew: .screen carries dir="rtl", so the stacks mirror as SwiftUI's do. The
     kit's status bar stays left-to-right, as on iOS. arrow.forward is a directional symbol;
     xmark, flame and the drawn checks are not. « x2 » and « +2 XP » are Latin strings and
     keep their own order (a Text takes its direction from its first strong character). */
  [dir="rtl"] .cta svg { transform: scaleX(-1); }
  [dir="rtl"] .pill-gold span, [dir="rtl"] .xp { unicode-bidi: plaintext; }
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="round-icon" data-aria="common.close">
      <!-- xmark, 44 × 0.36 ≈ 16 pt semibold -->
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M2 2l11 11M13 2 2 13"/></svg>
    </div>
    <div class="segments" id="segments"></div>
    <div class="pill-gold">
      <!-- flame.fill -->
      <svg width="11" height="14" viewBox="0 0 22 28" fill="#b17f10"><path d="M11.900.700c.5 4.200 2.900 6.500 5.200 9.100 2.500 2.800 4.400 5.500 4.400 9.200 0 5.300-4.500 9-10.500 9S.500 24.300.500 19c0-3.300 1.500-6.200 3.900-8.300.5-.4 1.200-.1 1.300.5.300 1.500.9 2.700 1.900 3.600C7.200 9.300 8.400 4.200 10.900.500c.3-.5 1-.3 1 .200Zm-.8 14.900c-1.900 2.200-3.500 4-3.500 6.300 0 2.100 1.500 3.500 3.400 3.500s3.400-1.400 3.400-3.500c0-2.300-1.500-4.100-3.300-6.300Z" fill-rule="evenodd"/></svg>
      <span id="comboPill"></span>
    </div>
  </div>

  <div class="content">
    <div class="header">
      <div class="eyebrow">
        <img src="../../../../ios/Sophia/Assets.xcassets/badge_subject_art.imageset/badge_subject_art.jpg" alt="">
        <span id="eyebrow"></span>
      </div>
      <h1 class="question" data-c="question"></h1>
    </div>

    <div class="options">
      <div class="option dimmed"><span data-c="option1"></span></div>
      <div class="option correct">
        <span data-c="option2"></span>
        <!-- DSCheckBadge(size: 26): success disc, white check, stroke 26 × 0.11 -->
        <svg class="check-badge" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#387d5a"/><path d="M7.020 13.600 11.330 18.020 18.980 8.460" fill="none" stroke="#fff" stroke-width="2.860" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="option dimmed"><span data-c="option3"></span></div>
      <div class="option dimmed"><span data-c="option4"></span></div>
    </div>
  </div>

  <div class="verdict">
    <div class="verdict-head">
      <div class="verdict-icon">
        <!-- CourseDrawnCheck, padding 9 → 14 × 14, stroke 2.6 -->
        <svg width="14" height="14" viewBox="0 0 14 14" overflow="visible"><path d="M0 7.700 5.040 12.880 14 1.680" fill="none" stroke="#387d5a" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="verdict-title" data-s="quiz.feedback.excellent"></div>
      <div class="xp" id="xp"></div>
    </div>
    <div class="combo">
      <svg width="9" height="11.500" viewBox="0 0 22 28" fill="#b17f10"><path d="M11.900.700c.5 4.200 2.900 6.500 5.200 9.100 2.500 2.800 4.400 5.500 4.400 9.200 0 5.300-4.500 9-10.500 9S.500 24.300.500 19c0-3.300 1.500-6.200 3.900-8.300.5-.4 1.200-.1 1.300.5.300 1.500.9 2.700 1.900 3.600C7.200 9.300 8.400 4.200 10.900.500c.3-.5 1-.3 1 .200Zm-.8 14.900c-1.900 2.200-3.500 4-3.500 6.300 0 2.100 1.500 3.500 3.400 3.500s3.400-1.400 3.400-3.500c0-2.300-1.500-4.100-3.300-6.300Z" fill-rule="evenodd"/></svg>
      <span id="comboLine"></span>
    </div>
    <p class="explanation" data-c="explanation"></p>
    <div class="cta">
      <span data-s="common.continue"></span>
      <!-- arrow.forward, subheadline semibold -->
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.500 7h13M9 1.500 14.500 7 9 12.500"/></svg>
    </div>
  </div>
</div>

<script src="../kit.js"></script>
<script src="l10n/quiz.js"></script>
<script>
  const LANG = new URLSearchParams(location.search).get("lang") || "fr";
  document.documentElement.lang = LANG;
  // French and English are inline below; the 23 other languages come from l10n/quiz.js
  // (built by tools/l10n_quiz.py).
  const L = (window.L10N || {})[LANG] || {};
  if (LANG === "ar" || LANG === "he") document.querySelector(".screen").dir = "rtl";
  // Interface strings (French and English tables of AppLocalizable.swift /
  // Localizable+ElevateCourse.swift).
  const S = {
    fr: {
      "common.close": "Fermer",
      "subject.art.short": "Art",
      "elevateCourse.quiz.questionOf": "Question %d sur %d",
      "quiz.feedback.excellent": "Excellent\u00a0!",
      "quiz.combo": "Combo x%d",
      "common.continue": "Continuer",
    },
    en: {
      "common.close": "Close",
      "subject.art.short": "Art",
      "elevateCourse.quiz.questionOf": "Question %d of %d",
      "quiz.feedback.excellent": "Excellent!",
      "quiz.combo": "Combo x%d",
      "common.continue": "Continue",
    },
  }[LANG] || L.S;
  // Course content: course_126_le_cubisme_picasso_et_braque, question 3 of its 9
  // (content/locales/<lang>/quizzes_v2.json). The app shuffles the options.
  const C = {
    fr: {
      question: "Quel tableau de 1907 marque le point de départ du cubisme\u00a0?",
      option1: "Guernica",
      option2: "Les Demoiselles d’Avignon",
      option3: "Le Déjeuner sur l’herbe",
      option4: "La Liberté guidant le peuple",
      explanation: "Les Demoiselles d’Avignon, avec ses nus aux facettes tranchantes, sidère jusqu’aux proches de Picasso.",
    },
    en: {
      question: "Which painting from 1907 marks the starting point of Cubism?",
      option1: "Guernica",
      option2: "Les Demoiselles d’Avignon",
      option3: "Luncheon on the Grass",
      option4: "Liberty Leading the People",
      explanation: "Les Demoiselles d’Avignon, with its sharp-faceted nudes, stunned even people close to Picasso.",
    },
  }[LANG] || L.C;
  // State of the screenshot.
  const N = { index: 3, total: 9, combo: 2, points: 2 };

  const fmt = (s, ...a) => { let i = 0; return s.replace(/%d/g, () => a[i++]); };
  document.querySelectorAll("[data-s]").forEach((el) => { el.innerHTML = S[el.dataset.s]; });
  document.querySelectorAll("[data-c]").forEach((el) => { el.innerHTML = C[el.dataset.c]; });
  document.querySelectorAll("[data-aria]").forEach((el) => el.setAttribute("aria-label", S[el.dataset.aria]));
  // « ART · QUESTION 3 SUR 9 » (uppercased in CSS, as uppercasedInApp does)
  document.getElementById("eyebrow").textContent =
    S["subject.art.short"] + " · " + fmt(S["elevateCourse.quiz.questionOf"], N.index, N.total);
  document.getElementById("comboPill").textContent = "x" + N.combo;
  document.getElementById("comboLine").textContent = fmt(S["quiz.combo"], N.combo);
  document.getElementById("xp").textContent = "+" + N.points + " XP";
  document.getElementById("segments").innerHTML =
    Array.from({ length: N.total }, (_, i) => `<i class="${i < N.index ? "on" : ""}"></i>`).join("");

  Kit.chrome({ status: "dark" });
</script>
</body>
</html>
