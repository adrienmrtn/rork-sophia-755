<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Explorer</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* ExploreView.swift : ScrollView > VStack(spacing: 24), marge latérale 24. */
  :root { --lh: 1.26; --navy: #1a3a6b; --saffron: #e6b233; --event-ink: #16263d; }
  body { line-height: var(--lh); }
  .scroll { position: absolute; left: 0; right: 0; top: var(--safe-top); padding: 8px 0 32px;
            display: flex; flex-direction: column; gap: 24px; }
  .pad { padding-left: 24px; padding-right: 24px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* homeCard() : fond blanc, contenu rogné, bordure 1,5 pt, rebord bas de 1 pt. */
  .card { position: relative; background: var(--surface); border-radius: 16px; overflow: hidden;
          box-shadow: 0 1px 0 var(--hairline); }
  .card::after { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--hairline);
                 border-radius: inherit; pointer-events: none; }

  /* Titre + recherche */
  .head { display: flex; flex-direction: column; gap: 14px; }
  .title { font-size: 34px; font-weight: 500; padding-top: 8px; margin: 0; }
  .search { height: 50px; padding: 0 14px; display: flex; align-items: center; gap: 10px; }
  .search svg { width: 19px; height: 19px; color: var(--ink-secondary); flex: none; }
  .search span { font-size: 15px; color: rgba(60, 60, 67, 0.3); }

  .section { display: flex; flex-direction: column; gap: 10px; }
  .sec-title { font-size: 17px; font-weight: 600; margin: 0; }
  .hscroll { display: flex; padding-left: 24px; overflow: hidden; }
  .hscroll > * { flex: none; }

  /* Événements (seulement avec ?events=1) */
  #events { display: none; }
  body.with-events #events { display: flex; }
  .events { gap: 12px; align-items: flex-start; padding-bottom: 8px; }
  .event { width: 232px; }
  .event .art { width: 232px; height: 130px; background: var(--navy); position: relative; overflow: hidden; }
  .event .halo, .event .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
  .event .halo { width: 142px; height: 142px; background: rgba(230, 178, 51, 0.16); }
  .event .ring { width: 191px; height: 191px; border: 1px solid rgba(230, 178, 51, 0.3); }
  .event .fan { position: absolute; left: 50%; top: 50%; width: 54.6px; height: 68.25px; margin: -34.1px 0 0 -27.3px;
                border-radius: 7.6px; overflow: hidden; box-shadow: 0 6px 10px rgba(0, 0, 0, 0.28); }
  .event .fan img { width: 100%; height: 100%; object-fit: cover; }
  .event .fan::after { content: ""; position: absolute; inset: 0; border: 2px solid rgba(255, 255, 255, 0.9); border-radius: inherit; }
  .event .fan.l { transform: translate(-39.3px, 5.5px) rotate(-9deg); }
  .event .fan.r { transform: translate(39.3px, 5.5px) rotate(9deg); }
  .event .fan.c { z-index: 2; }
  .event .txt { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .event .dates { font-size: 12px; font-weight: 700; color: var(--accent); }
  .event .name { font-size: 16px; font-weight: 700; min-height: calc(2 * 16px * var(--lh)); }
  .event .count { font-size: 13px; color: var(--ink-secondary); }

  /* On cherche beaucoup cette semaine */
  .trend-label { font-size: 13px; font-weight: 700; color: var(--ink-secondary); }
  .trends { gap: 8px; padding-bottom: 2px; }
  .chip { height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px;
          font-size: 15px; font-weight: 700; white-space: nowrap; }
  .chip svg { width: 15px; height: 14px; flex: none; }

  /* Univers */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile img { width: 100%; height: 84px; object-fit: cover; background: var(--surface-muted); }
  .tile .txt { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .tile .name { font-size: 13px; font-weight: 700; min-height: calc(2 * 13px * var(--lh)); }
  .tile .count { font-size: 12px; color: var(--ink-secondary); }

  /* Créateurs à suivre */
  .creators { gap: 10px; align-items: flex-start; padding-bottom: 8px; }
  .creator { width: 168px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-tint); overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 21.6px; font-weight: 800; color: var(--accent); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .creator .who { display: flex; align-items: center; gap: 5px; max-width: 100%; font-size: 15px; font-weight: 700; }
  .creator .who svg { width: 14px; height: 14px; flex: none; }
  .creator .pedigree { font-size: 12px; color: var(--ink-secondary); min-height: calc(2 * 12px * var(--lh));
                       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .creator .followers { font-size: 13px; font-weight: 600; }
  .follow { height: 44px; padding: 0 16px; border-radius: 14px; display: flex; align-items: center;
            font-size: 15px; font-weight: 700; background: var(--accent); color: #fff; }
  .follow.on { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--hairline); }

  /* Parcours */
  .path { position: relative; min-height: 132px; background: var(--navy); border-radius: 16px; overflow: hidden;
          padding: 16px 146px 16px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .path img { position: absolute; right: 0; top: 0; width: 130px; height: 100%; object-fit: cover; }
  .path .t { font-size: 20px; font-weight: 800; color: #fff; }
  .path .s { font-size: 15px; color: #c9d6ee; line-height: calc(var(--lh) * 1em + 2px); }
  .path .pill { align-self: flex-start; margin-top: 4px; height: 32px; padding: 0 12px; border-radius: 16px;
                background: var(--saffron); color: var(--event-ink); display: flex; align-items: center; gap: 4px;
                font-size: 15px; font-weight: 800; }
  .path .pill svg { width: 8px; height: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- chart.line.uptrend.xyaxis -->
    <symbol id="i-trend" viewBox="0 0 15 14">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.2 1v11.800h12.800"/>
        <path d="M4 9.300l2.900-3.100 2.200 2 4-4.400"/>
        <path d="M10.200 3.500h3.100v3.100"/>
      </g>
    </symbol>
    <!-- checkmark.circle.fill (palette : blanc sur accent) -->
    <symbol id="i-verified" viewBox="0 0 14 14">
      <circle cx="7" cy="7" r="7" fill="#2e62c4"/>
      <path d="M3.900 7.300l2.100 2.100 4.100-4.500" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="scroll">
  <div class="head pad">
    <h1 class="title" data-s="tab.explore"></h1>
    <div class="card search">
      <!-- magnifyingglass -->
      <svg viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M12.600 12.600 17 17"/></svg>
      <span data-s="explore.search.placeholder"></span>
    </div>
  </div>

  <div class="section" id="events">
    <h2 class="sec-title pad" data-s="badges.family.events"></h2>
    <div class="hscroll events">
      <div class="card event">
        <div class="art">
          <div class="halo"></div><div class="ring"></div>
          <div class="fan l"><img src="../../../../ios/Sophia/CourseImages/la_sante_mentale_comme_enjeu_de_societe.jpg" alt=""></div>
          <div class="fan r"><img src="../../../../ios/Sophia/CourseImages/comment_le_cerveau_stocke_les_souvenirs.jpg" alt=""></div>
          <div class="fan c"><img src="../../../../ios/Sophia/CourseImages/pourquoi_reve_t_on.jpg" alt=""></div>
        </div>
        <div class="txt">
          <div class="dates" data-s="event.until" data-arg-c="eventEnd"></div>
          <div class="name" data-c="eventTitle"></div>
          <div class="count" data-s="event.card.coursesToRead" data-arg="3"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="trend-label pad" data-s="explore.trending"></div>
    <div class="hscroll trends">
      <div class="card chip"><svg><use href="#i-trend"/></svg><span data-c="trend1"></span></div>
      <div class="card chip"><svg><use href="#i-trend"/></svg><span data-c="trend2"></span></div>
      <div class="card chip"><svg><use href="#i-trend"/></svg><span data-c="trend3"></span></div>
      <div class="card chip"><svg><use href="#i-trend"/></svg><span data-c="trend4"></span></div>
    </div>
  </div>

  <div class="section pad">
    <h2 class="sec-title" data-s="explore.universes"></h2>
    <div class="grid">
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/la_chute_du_mur_de_berlin_1989.jpg" alt="">
        <div class="txt"><div class="name" data-c="u1"></div><div class="count" data-s="subject.courses.count" data-arg="25"></div></div></div>
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/le_grand_gatsby_fitzgerald.jpg" alt="">
        <div class="txt"><div class="name" data-c="u2"></div><div class="count" data-s="subject.courses.count" data-arg="24"></div></div></div>
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/pourquoi_les_abeilles_sont_vitales.jpg" alt="">
        <div class="txt"><div class="name" data-c="u3"></div><div class="count" data-s="subject.courses.count" data-arg="23"></div></div></div>
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/qu_est_ce_qu_un_trou_noir.jpg" alt="">
        <div class="txt"><div class="name" data-c="u4"></div><div class="count" data-s="subject.courses.count" data-arg="23"></div></div></div>
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/thor_et_loki_mythologie_nordique.jpg" alt="">
        <div class="txt"><div class="name" data-c="u5"></div><div class="count" data-s="subject.courses.count" data-arg="20"></div></div></div>
      <div class="card tile"><img src="../../../../ios/Sophia/CourseImages/comment_les_avions_volent.jpg" alt="">
        <div class="txt"><div class="name" data-c="u6"></div><div class="count" data-s="subject.courses.count" data-arg="20"></div></div></div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title pad" data-s="explore.creatorsToFollow"></h2>
    <div class="hscroll creators">
      <div class="card creator">
        <div class="avatar" data-c="a1initials"></div>
        <div class="who"><span class="ellipsis" data-c="a1name"></span><svg><use href="#i-verified"/></svg></div>
        <div class="pedigree" data-c="a1title"></div>
        <div class="followers"><span data-c="a1followers"></span> <span data-s="creator.stat.followers"></span></div>
        <div class="follow" data-s="creator.follow"></div>
      </div>
      <div class="card creator">
        <div class="avatar"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_ivana_toskovic.jpg" alt=""></div>
        <div class="who"><span class="ellipsis" data-c="a2name"></span><svg><use href="#i-verified"/></svg></div>
        <div class="pedigree" data-c="a2title"></div>
        <div class="followers"><span data-c="a2followers"></span> <span data-s="creator.stat.followers"></span></div>
        <div class="follow on" data-s="creator.following"></div>
      </div>
      <div class="card creator">
        <div class="avatar"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_rana_abdalla.jpg" alt=""></div>
        <div class="who"><span class="ellipsis" data-c="a3name"></span><svg><use href="#i-verified"/></svg></div>
        <div class="pedigree" data-c="a3title"></div>
        <div class="followers"><span data-c="a3followers"></span> <span data-s="creator.stat.followers"></span></div>
        <div class="follow" data-s="creator.follow"></div>
      </div>
    </div>
  </div>

  <div class="pad">
    <div class="path">
      <img src="../../../../ios/Sophia/Assets.xcassets/path_poster.imageset/path_poster.jpg" alt="">
      <div class="t" data-s="path.title"></div>
      <div class="s" data-s="explore.path.subtitle"></div>
      <div class="pill"><span data-s="path.levelCaption" data-arg="4"></span>
        <!-- chevron.forward -->
        <svg viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.500 1.500 6 6l-4.500 4.500"/></svg>
      </div>
    </div>
  </div>
</div>

<script src="../kit.js"></script>
<script>
  // Chaînes d'interface (table française de l'app). %d / %@ : argument dans data-arg ou data-arg-c.
  const S = {
    "tab.explore": "Explorer",
    "explore.search.placeholder": "Pose une question, cherche un sujet",
    "badges.family.events": "Événements",
    "event.until": "Jusqu’au %@",
    "event.card.coursesToRead": "%d cours à lire",
    "explore.trending": "On cherche beaucoup cette semaine",
    "explore.universes": "Univers",
    "subject.courses.count": "%d cours",
    "explore.creatorsToFollow": "Créateurs à suivre",
    "creator.stat.followers": "abonnés",
    "creator.follow": "Suivre",
    "creator.following": "Abonné",
    "path.title": "Parcours",
    "explore.path.subtitle": "Monte de niveau, un cours après l’autre.",
    "path.levelCaption": "Niveau %d",
  };
  // Contenu du catalogue (cours, sous-catégories, créateurs, événement).
  const C = {
    eventTitle: "Movember",
    eventEnd: "30 nov.",
    trend1: "La Métamorphose, Kafka",
    trend2: "La Grande Dépression",
    trend3: "La structure de l’ADN",
    trend4: "Moby Dick, Melville",
    u1: "Guerre froide & monde contemporain",
    u2: "Anglo-saxons & littérature mondiale",
    u3: "Environnement & avenir",
    u4: "La Terre et l’Univers",
    u5: "Autres mythologies",
    u6: "Notre quotidien expliqué",
    a1name: "Myra Houser", a1initials: "MH", a1title: "Historienne", a1followers: "5,5 k",
    a2name: "Ivana Toskovic", a2followers: "5,3 k",
    a2title: "Master d’études régionales sur les États-Unis, licence de relations internationales, université de Belgrade",
    a3name: "Rana Abdalla", a3followers: "4,9 k",
    a3title: "Doctorante en ingénierie des systèmes industriels, université nationale Jeonbuk",
  };
  document.querySelectorAll("[data-c]").forEach((el) => { el.innerHTML = C[el.dataset.c]; });
  document.querySelectorAll("[data-s]").forEach((el) => {
    const arg = el.dataset.argC ? C[el.dataset.argC] : el.dataset.arg;
    el.innerHTML = S[el.dataset.s].replace(/%d|%@/, arg ?? "");
  });
  // L'événement éditorial (Movember, 1er au 30 novembre) : explore.html?events=1 pour l'afficher.
  if (new URLSearchParams(location.search).get("events") === "1") document.body.classList.add("with-events");
  Kit.chrome({ tab: "explore" });
</script>
</body>
</html>
