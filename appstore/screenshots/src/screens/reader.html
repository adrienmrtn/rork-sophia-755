<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia · lecteur de cours</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* CourseView.lessonsBody : headerBar, fil pas à pas (CourseStepReaderView), bottomButton. */
  .reader { position: absolute; inset: var(--safe-top) 0 var(--safe-bottom) 0; display: flex; flex-direction: column; }

  /* headerBar : HStack(spacing: 8), padding 10 / 24 */
  .header { display: flex; align-items: center; gap: 8px; padding: 10px 24px; flex: none; }
  /* CourseRoundIcon : 44 pt, surface, hairline 1 pt, glyphe 0,36 × 44 semibold */
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--hairline); display: grid; place-items: center; flex: none; color: var(--ink); }
  .round svg { display: block; }
  /* progressBar : un segment par section, 5 pt de haut, espacement 5, padding horizontal 2 */
  .progress { flex: 1; display: flex; gap: 5px; height: 5px; margin: 0 2px; }
  .seg { flex: 1; height: 5px; border-radius: 3px; background: rgba(34, 38, 46, 0.12); overflow: hidden; }
  .seg i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .count { font-size: 13px; font-weight: 700; color: var(--ink-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }

  /* CourseStepReaderView : ScrollView, VStack(spacing: 20), padding 24 / top 12 */
  .scroll { flex: 1; overflow: hidden; position: relative; }
  .thread { position: absolute; left: 0; right: 0; top: 0; padding: 12px 24px 0; display: flex; flex-direction: column; gap: 20px; }

  /* SectionHeaderV2 : 24 pt semibold, lineSpacing 2, padding top 6 */
  .section-title { margin: 0; padding-top: 6px; font-size: 24px; font-weight: 600; line-height: 32px; color: var(--ink); }

  /* ProseParagraph : corps 17 pt, lineSpacing 7, gras 700, terme de glossaire souligné en pointillés */
  .prose { margin: 0; font-size: 17px; font-weight: 400; line-height: 28.4px; color: var(--ink); }
  .prose b { font-weight: 700; }
  .prose .term { text-decoration: underline dotted var(--ink); text-decoration-thickness: 1.4px; text-underline-offset: 3.5px; }

  /* AspectImageView : VStack(spacing: 6), image 4:3, rayon 16, hairline 1 pt, légende puis crédit */
  .figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .figure .frame { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; }
  .figure .frame img { width: 100%; height: 100%; object-fit: cover; }
  .figure .frame::after { content: ""; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hairline); }
  .figure .caption { font-size: 13px; line-height: 17px; color: var(--ink-secondary); padding: 0 4px; }
  .figure .credit { font-size: 11px; line-height: 14px; color: var(--ink-tertiary); padding: 0 4px; }

  /* bottomButton : CourseCTAStyle, padding 24 / top 8 / bottom 24 */
  .bottom { flex: none; padding: 8px 24px 24px; background: var(--canvas); }
  .cta { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 17px 12px;
    border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; line-height: 22px; }
  .cta svg { display: block; }
</style>
</head>
<body>
<div class="reader">
  <div class="header">
    <div class="round"><!-- xmark -->
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M2.2 2.2l10.6 10.6M12.800 2.200 2.200 12.800"/></svg>
    </div>
    <div class="progress">
      <div class="seg"><i style="width:100%"></i></div>
      <div class="seg"><i style="width:80%"></i></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>
    <div class="count" data-c="counter"></div>
    <div class="round"><!-- ellipsis -->
      <svg width="18" height="5" viewBox="0 0 18 5" fill="currentColor"><circle cx="2.300" cy="2.500" r="1.900"/><circle cx="9" cy="2.500" r="1.900"/><circle cx="15.700" cy="2.500" r="1.900"/></svg>
    </div>
    <div class="round"><!-- headphones -->
      <svg width="19" height="18" viewBox="0 0 19 18" fill="none"><path d="M2.300 12.200V9.200a7.200 7.200 0 0 1 14.400 0v3" stroke="currentColor" stroke-width="1.900" stroke-linecap="round"/><rect x="1.200" y="9.800" width="4.300" height="7" rx="1.800" fill="currentColor"/><rect x="13.500" y="9.800" width="4.300" height="7" rx="1.800" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="scroll">
    <div class="thread" id="thread">
      <h1 class="section-title" data-c="sectionTitle"></h1>
      <p class="prose" data-c="p1"></p>
      <figure class="figure">
        <div class="frame"><img alt=""></div>
        <div class="caption" data-c="caption"></div>
        <div class="credit" data-c="credit"></div>
      </figure>
      <p class="prose" data-c="p2"></p>
    </div>
  </div>

  <div class="bottom">
    <div class="cta">
      <span data-s="common.continue"></span>
      <!-- arrow.forward -->
      <svg width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.500 7h13.600M9.600 1.500 15.100 7l-5.500 5.500"/></svg>
    </div>
  </div>
</div>

<script src="../kit.js"></script>
<script>
  const LANG = new URLSearchParams(location.search).get("lang") || "fr";
  document.documentElement.lang = LANG;
  // Interface (AppLocalizable.swift, tables française et anglaise).
  const S = {
    fr: {
      "common.continue": "Continuer",
    },
    en: {
      "common.continue": "Continue",
    },
  }[LANG];
  // Contenu.
  // fr : content/courses/fr/course_69_comment_se_forment_les_eclairs.json, section 2 sur 5 (4 passages révélés sur 5).
  // en : content/courses/en/course_269_pourquoi_personne_ne_sourit_sur_les.json, section 4 of 5 (4 of 6 steps revealed).
  const C = {
    fr: {
      counter: "2 / 5",
      segments: [1, 0.8, 0, 0, 0],
      image: "cumulonimbus_thunderstorm_cloud",
      ratio: "4 / 3",
      scrollY: 0,
      scrollYPad: 10,
      sectionTitle: "Dans le nuage, des charges se séparent",
      p1: "Les éclairs naissent surtout dans les <span class=\"term\">cumulonimbus</span>\u00a0: de très grands nuages d’orage, qui peuvent monter jusqu’à environ <b>15\u00a0km</b>. À l’intérieur, l’air monte et descend très fort.",
      caption: "Le cumulonimbus\u00a0: l’usine à orages.",
      credit: "Cumulonimbus stormcloud — Loncoin (CC BY-SA 4.0)",
      p2: "Dans ce chaos, de petits <b>cristaux de glace</b> montent, et des grains de glace plus lourds (du <span class=\"term\">grésil</span>) descendent. Quand ils se percutent, des charges électriques s’échangent. Peu à peu, le haut du nuage devient plutôt positif, la base plutôt négative.",
    },
    en: {
      counter: "4 / 5",
      segments: [1, 1, 1, 4 / 6, 0],
      image: "frans_hals_malle_babbe_laughing_woman_painting",
      ratio: "3 / 2",
      scrollYPad: 0,
      scrollY: 15, // position de défilement : la coupe du bas tombe entre deux lignes
      sectionTitle: "A smile meant something else",
      p1: "The real answer is that a photograph was not a <span class=\"term\">snapshot</span>. It was a portrait, and portraiture already came with <b>three hundred years</b> of rules inherited from painting. Painters knew what a wide smile signaled, and it was not happiness.",
      caption: "Malle Babbe, by Frans Hals (Gemäldegalerie, Berlin), detail: a wide-open laugh, the mark of madness or drunkenness in painting.",
      credit: "Frans Hals Malle Babbe about 1640-1646 Gemäldegalerie Berlin 9387 — Frans Hals (Public domain)",
      p2: "The art historian <span class=\"term\">Angus Trumble</span>, who wrote a history of the smile, puts it bluntly: a broad grin read as a sign of madness, drunkenness or stupidity. A saint might wear a faint one. A respectable person posing for their portrait did not.",
    },
  }[LANG];
  document.querySelectorAll("[data-s]").forEach((el) => { el.innerHTML = S[el.dataset.s]; });
  document.querySelectorAll("[data-c]").forEach((el) => { el.innerHTML = C[el.dataset.c]; });
  document.querySelectorAll(".seg").forEach((el, i) => {
    el.innerHTML = C.segments[i] > 0 ? `<i style="width:${C.segments[i] * 100}%"></i>` : "";
  });
  const frame = document.querySelector(".figure .frame");
  frame.style.aspectRatio = C.ratio;
  if (Kit.ipad) C.scrollY = C.scrollYPad;
  if (C.scrollY) document.getElementById("thread").style.top = -C.scrollY + "px";
  frame.querySelector("img").src = `../../../../content/images/${C.image}.jpg`;
  Kit.chrome({ status: "dark" });
</script>
</body>
</html>
