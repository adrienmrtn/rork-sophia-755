<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia · Duel en cours</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* DuelTheme / DuelPalette (ios/Sophia/Views/Duels/DuelElevateKit.swift, DuelComponents.swift) */
  :root {
    --score-block: #f4f6fa; --score-rule: #e1e5eb; --timer-track: #d5dce8;
    --strip-idle: #dde2ea; --strip-right: #3fbf8f; --strip-wrong: #e0564a;
    --faint: #a3abb8; --saffron: #f2b134; --subject-art: #d98cf2;
  }
  .game { position: absolute; left: 0; right: 0; top: var(--safe-top); bottom: var(--safe-bottom);
          display: flex; flex-direction: column; }
  .num { font-variant-numeric: tabular-nums; }

  /* topBar */
  .topbar { margin: 8px 24px 0; display: flex; align-items: center; gap: 8px; height: 44px; }
  .round-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface);
               border: 1.5px solid var(--hairline); display: flex; align-items: center; justify-content: center; flex: none; }
  .topbar .mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; line-height: 14px; }
  .counter { font-size: 15px; line-height: 19px; font-weight: 700; color: var(--ink); }
  .counter .tail { font-weight: 500; color: var(--ink-tertiary); }
  .topbar .ghost { width: 44px; height: 44px; flex: none; }

  /* scoreBlock */
  .score { margin: 14px 24px 0; padding: 14px 14px 12px; border-radius: 20px; background: var(--score-block);
           display: flex; flex-direction: column; gap: 12px; }
  .sides { display: flex; align-items: center; gap: 8px; }
  .side { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .side.mirrored { justify-content: flex-end; }
  .avatar { position: relative; width: 48px; height: 48px; border-radius: 50%; flex: none; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .avatar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--ring); }
  .labels { display: flex; flex-direction: column; gap: 3px; }
  .side.mirrored .labels { align-items: flex-end; }
  .labels .pts { font-size: 36px; font-weight: 800; height: 38px; line-height: 38px; }
  .labels .name { font-size: 12px; line-height: 15px; white-space: nowrap; }
  .side.me .pts { color: var(--accent); }
  .side.me .name { font-weight: 700; color: var(--ink); }
  .side.them .pts { color: var(--ink-tertiary); }
  .side.them .name { font-weight: 600; color: var(--ink-secondary); }
  .timer { position: relative; width: 58px; height: 58px; flex: none; }
  .timer svg { position: absolute; inset: 0; }
  .timer span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-size: 22px; font-weight: 800; color: var(--ink); }
  .rule { height: 1px; background: var(--score-rule); }
  .board { display: flex; flex-direction: column; gap: 6px; }
  .board .row { display: flex; align-items: center; gap: 8px; }
  .board .lab { width: 52px; flex: none; font-size: 11px; line-height: 14px; white-space: nowrap; }
  .board .lab.strong { font-weight: 700; color: var(--ink); }
  .board .lab.soft { font-weight: 600; color: var(--ink-secondary); }
  .board .groups { flex: 1; display: flex; gap: 8px; align-items: center; }
  .board .grp { flex: 1; display: flex; gap: 2px; }
  .board .rl { flex: 1; text-align: center; font-size: 10px; line-height: 13px; font-weight: 800; letter-spacing: 0.6px; color: var(--faint); }
  .board .rl.on { color: var(--accent); }
  .cell { flex: 1; height: 5px; border-radius: 2.5px; background: var(--strip-idle); }
  .cell.r { background: var(--strip-right); } .cell.w { background: var(--strip-wrong); }

  /* questionArea */
  .scroll { flex: 1; min-height: 0; }
  .qa { padding: 20px 24px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .subject { display: flex; align-items: center; gap: 6px; }
  .subject i { width: 20px; height: 20px; border-radius: 50%; background: var(--subject-art);
               display: flex; align-items: center; justify-content: center; }
  .subject span { font-size: 12px; line-height: 15px; font-weight: 800; letter-spacing: 0.8px; color: var(--accent); text-transform: uppercase; }
  .qimg { height: 230px; width: 280px; display: flex; align-items: center; justify-content: center; }
  .qimg img { height: 230px; width: auto; border-radius: 16px; }
  .qtext { width: 100%; text-align: center; font-size: 22px; line-height: 29px; font-weight: 700; color: var(--ink); padding-bottom: 10px; }
  .grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { min-height: 60px; padding: 8px 12px; border-radius: 16px; display: flex; align-items: center; gap: 10px;
         font-size: 16px; line-height: 20px; font-weight: 600; color: var(--ink);
         background: var(--surface); border: 1.5px solid var(--b); box-shadow: 0 1.5px 0 var(--b); --b: var(--hairline); }
  .opt span { flex: 1; min-width: 0; }
  .opt.dimmed { color: var(--ink-tertiary); font-weight: 500; opacity: 0.6; --b: rgba(218,221,226,0.7); }
  .opt.correct { color: var(--success); font-weight: 800; background: var(--success-tint); --b: var(--success); }
  .opt.wrong { background: var(--danger-tint); --b: var(--danger); }
  .opt .mark { flex: none; width: 26px; height: 26px; border-radius: 50%; }
  .opt .opp { position: relative; }
  .opt .opp img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .opt .opp::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--saffron); }

  /* verdictBanner */
  .verdict { margin: 6px 24px 10px; min-height: 48px; padding: 12px 16px; border-radius: 16px;
             background: var(--success-tint); color: var(--success); display: flex; align-items: center; gap: 10px; }
  .verdict .main { font-size: 16px; line-height: 21px; font-weight: 800; white-space: nowrap; }
  .verdict .detail { margin-left: auto; text-align: right; font-size: 13px; line-height: 17px; font-weight: 700; white-space: nowrap; }
</style>
</head>

<script>

  const LANG = new URLSearchParams(location.search).get("lang") || "fr";
  document.documentElement.lang = LANG;
  const S = { fr: {
    "duel.round.of": "Manche %1$d sur %2$d",
    "duel.game.counter": "Question %1$d / %2$d",
    "duel.you": "Toi",
    "duel.round.short": "M%d",
    "subject.art": "Art",
    "duel.game.correct": "Bonne réponse !",
    "duel.verdict.point": "+1 point",
    "duel.verdict.leading": "tu mènes %1$d à %2$d",
  }, en: {
    "duel.round.of": "Round %1$d of %2$d",
    "duel.game.counter": "Question %1$d / %2$d",
    "duel.you": "You",
    "duel.round.short": "R%d",
    "subject.art": "Art",
    "duel.game.correct": "Correct!",
    "duel.verdict.point": "+1 point",
    "duel.verdict.leading": "you lead %1$d–%2$d",
  } }[LANG];
  // Content: duel question dq_en_2_152 (fr: content/duels/i18n/fr.json, en: content/duels/questions_en.json), opponent handle.
  const C = { fr: {
    opponent: "maelys24",
    opponentAt: "@maelys24",
    question: "Comment s’appelle ce tableau ?",
    o0: "La Joconde",
    o1: "La Dame à l’hermine",
    o2: "La Jeune Fille à la perle",
    o3: "La Laitière",
  }, en: {
    opponent: "hollyb24",
    opponentAt: "@hollyb24",
    question: "What is this painting called?",
    o0: "Mona Lisa",
    o1: "Lady with an Ermine",
    o2: "Girl with a Pearl Earring",
    o3: "The Milkmaid",
  } }[LANG];
  const fmt = (t, a = []) => { let i = 0; return t.replace(/%(?:(\d+)\$)?[d@]/g, (_, n) => a[n ? n - 1 : i++]); };
  document.querySelectorAll("[data-s]").forEach((el) => {
    el.innerHTML = fmt(S[el.dataset.s], el.dataset.a ? JSON.parse(el.dataset.a) : []);
  });
  document.querySelectorAll("[data-c]").forEach((el) => { el.innerHTML = C[el.dataset.c]; });

  // « Question 8 / 20 » : bold number, grey from the slash on (DuelGameView.questionCounter).
  const full = fmt(S["duel.game.counter"], [8, 20]), cut = full.indexOf("/");
  document.getElementById("counter").innerHTML = full.slice(0, cut) + '<span class="tail">' + full.slice(cut) + "</span>";
  document.getElementById("detail").textContent =
    [S["duel.verdict.point"], fmt(S["duel.verdict.leading"], [6, 4])].join(" · ");

  // Score board: 4 rounds of 5 questions; 8 played (1 = scored, 0 = missed).
  const strip = (id, marks) => {
    let h = "";
    for (let g = 0; g < 4; g++) {
      h += '<div class="grp">';
      for (let k = 0; k < 5; k++) { const m = marks[g * 5 + k]; h += '<div class="cell' + (m === 1 ? " r" : m === 0 ? " w" : "") + '"></div>'; }
      h += "</div>";
    }
    document.getElementById(id).innerHTML = h;
  };
  strip("strip-me", [1, 1, 0, 1, 1, 1, 0, 1]);
  strip("strip-them", [1, 0, 1, 1, 0, 1, 0, 0]);
  document.getElementById("rounds").innerHTML = [1, 2, 3, 4].map((n) =>
    '<div class="rl' + (n === 2 ? " on" : "") + '">' + fmt(S["duel.round.short"], [n]) + "</div>").join("");

  Kit.chrome({ status: "dark" }); // full-screen cover: no tab bar during a game
