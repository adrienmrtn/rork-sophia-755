<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sophia · Profil</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* ProfileV2View: ScrollView > VStack(padding 20, bottom +24). Line height of Plus Jakarta Sans = 1.26 em. */
  body { line-height: 1.26; }
  #viewport { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--tabbar) + var(--safe-bottom)); overflow: hidden; }
  #page { padding: calc(var(--safe-top) + 20px) 20px 44px; display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.ic { display: block; flex: none; }

  /* dsCard / homeCard: white, 1.5 pt hairline border, 1 pt lower lip */
  .card { background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 16px; box-shadow: 0 1px 0 var(--hairline); }

  /* titleRow */
  .title-row { height: 44px; justify-content: space-between; }
  .title-row h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: 0; }
  .round-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--hairline); background: var(--surface); display: grid; place-items: center; color: var(--ink); }

  /* identity */
  .identity { margin-top: 14px; gap: 14px; }
  .avatar { border-radius: 50%; object-fit: cover; flex: none; }
  .identity .name { font-size: 20px; font-weight: 600; }
  .identity .since { font-size: 13px; color: var(--ink-secondary); margin-top: 3px; }

  /* statsCard */
  .stats { margin-top: 14px; padding: 14px 16px; gap: 16px; }
  .stat { flex: 1; gap: 10px; min-width: 0; }
  .stat .disc { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-tint); display: grid; place-items: center; flex: none; }
  .stat .value { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 12px; color: var(--ink-secondary); }
  .stats .rule { width: 1px; height: 36px; background: var(--hairline); flex: none; }

  /* trophiesCard */
  .trophies { margin-top: 10px; height: 96px; border-radius: 16px; overflow: hidden; position: relative; background: #A47523 center / cover no-repeat; color: #fff; }
  .trophies::before { content: ""; position: absolute; inset: 0; background: rgba(14, 25, 46, 0.6); }
  .trophies .in { position: absolute; inset: 0; padding: 0 16px; justify-content: space-between; gap: 8px; }
  .trophies .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; }
  .trophies .league { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .trophies .count { gap: 3px; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .trophies .count svg { width: 28px; height: 28px; color: #f2b134; }

  /* ProfilePosterCard */
  .poster { margin-top: 10px; padding: 10px 14px 10px 10px; gap: 12px; }
  .poster img { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex: none; }
  .poster .txt { flex: 1; min-width: 0; }
  .poster .t { font-size: 17px; font-weight: 600; }
  .poster .s { font-size: 13px; color: var(--ink-secondary); margin-top: 2px; }
  .poster svg { color: var(--ink-secondary); }

  /* ProfileSectionHeader */
  .section { margin-top: 24px; }
  .sec-head { display: flex; align-items: baseline; gap: 6px; }
  .sec-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .sec-head .detail { font-size: 20px; font-weight: 600; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
  .sec-head .link { margin-left: auto; display: flex; align-items: center; gap: 3px; padding: 6px 0; color: var(--accent); font-size: 15px; font-weight: 700; }

  /* followingSection */
  .following { margin-top: 10px; padding: 2px 0; display: flex; align-items: flex-start; gap: 16px; }
  .creator { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .creator img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: inset 0 0 0 1px var(--hairline); outline: 1px solid var(--hairline); outline-offset: -1px; background: var(--accent-tint); }
  .creator span { font-size: 12px; font-weight: 700; max-width: 64px; }
  .creator .dash { width: 56px; height: 56px; position: relative; display: grid; place-items: center; color: var(--ink-secondary); }
  .creator .dash svg.ring { position: absolute; inset: 0; }
  .creator.more span { color: var(--ink-secondary); }

  /* ProfilePillTabs */
  .pills { display: flex; gap: 6px; }
  .pill { height: 40px; padding: 0 14px; border-radius: 14px; background: var(--accent-tint); color: var(--ink); font-size: 15px; font-weight: 700; display: grid; place-items: center; white-space: nowrap; }
  .pill.on { background: var(--accent); color: #fff; }
  .pills.fills .pill { flex: 1; }

  /* FriendsLeaderboardSection */
  .friends > * + * { margin-top: 10px; }
  .board { overflow: hidden; }
  .podium { display: flex; align-items: flex-end; gap: 8px; padding: 18px 12px 12px; }
  .pcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pcol .ring { border-radius: 50%; position: relative; }
  .pcol .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: var(--rw) solid var(--medal); }
  .pcol .handle { font-size: 13px; font-weight: 700; }
  .pcol .handle.me { color: var(--accent); background: var(--accent-tint); border-radius: 99px; padding: 2px 8px; }
  .pcol .xp { font-size: 12px; font-weight: 700; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
  .pcol .step { align-self: stretch; display: grid; place-items: center; font-weight: 800; color: var(--medal); background: color-mix(in srgb, var(--medal) 20%, transparent); border-radius: 14px 14px 4px 4px; }
  .lrow { padding: 11px 16px; gap: 12px; border-top: 1px solid var(--hairline); }
  .lrow .rank { width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink-secondary); font-variant-numeric: tabular-nums; flex: none; }
  .lrow .handle { font-size: 15px; font-weight: 700; }
  .lrow .xp { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
  .lrow svg { color: var(--ink-secondary); }
  .cta { background: var(--accent); color: #fff; border-radius: 16px; padding: 17px 12px; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .qr-row { display: flex; gap: 10px; }
  .qr { flex: 1; height: 50px; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; }

  /* BadgeRow */
  .badges { margin-top: 10px; display: flex; gap: 10px; align-items: flex-start; }
  .badge { flex: 1; min-width: 0; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .badge img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: var(--accent); }
  .badge span { font-size: 12px; font-weight: 700; text-align: center; height: 2.52em; }

  /* listsSection + CompactCourseRow */
  .lists > * + * { margin-top: 9px; }
  .course { padding: 10px 12px 10px 10px; gap: 12px; }
  .course img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-muted); }
  .course .t { font-size: 15px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .course .m { font-size: 13px; color: var(--ink-secondary); margin-top: 3px; }
</style>
</head>
<body>
<div id="viewport"><div id="page">

  <!-- titleRow -->
  <div class="row title-row">
    <h1 data-s="profile.title"></h1>
    <div class="round-btn">
      <!-- gearshape -->
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M9.97 4.37 L10.46 1.82 L13.54 1.82 L14.03 4.37 L15.96 5.17 L18.11 3.71 L20.29 5.89 L18.83 8.04 L19.63 9.97 L22.18 10.46 L22.18 13.54 L19.63 14.03 L18.83 15.96 L20.29 18.11 L18.11 20.29 L15.96 18.83 L14.03 19.63 L13.54 22.18 L10.46 22.18 L9.97 19.63 L8.04 18.83 L5.89 20.29 L3.71 18.11 L5.17 15.96 L4.37 14.03 L1.82 13.54 L1.82 10.46 L4.37 9.97 L5.17 8.04 L3.71 5.89 L5.89 3.71 L8.04 5.17Z"/><circle cx="12" cy="12" r="3.3"/></svg>
    </div>
  </div>

  <!-- identity -->
  <div class="row identity">
    <img class="avatar" width="64" height="64" src="../../../../ios/Sophia/Assets.xcassets/avatar_57.imageset/avatar_57.jpg" alt="">
    <div style="min-width:0">
      <div class="name one-line" data-c="handle"></div>
      <div class="since one-line" data-s="profile.member.since" data-a="memberSince"></div>
    </div>
  </div>

  <!-- statsCard -->
  <div class="card row stats">
    <div class="row stat">
      <div class="disc">
        <!-- flame.fill -->
        <svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="#e6b333" fill-rule="evenodd"><path d="M12.700 1.300c.5 3.300 2.200 5.100 3.900 7.100 1.600 1.900 3 4 3 6.900a7.600 7.600 0 0 1-15.200 0c0-2.300.9-4.400 2.300-6 .3 1.500.9 2.600 1.900 3.400C8.500 8.200 9.800 4 12.700 1.300ZM12 20.700a3.100 3.100 0 0 0 3.100-3.100c0-1.800-1.200-2.900-3.100-5.100-1.900 2.200-3.100 3.300-3.100 5.100a3.100 3.100 0 0 0 3.100 3.100Z"/></svg>
      </div>
      <div style="min-width:0">
        <div class="value" data-s="common.daysShort" data-a="streak"></div>
        <div class="label one-line" data-s="friends.stats.streak" data-lower></div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="row stat">
      <div class="disc">
        <!-- book -->
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2e62c4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 6.600C10 5 7.200 4.500 3.300 4.800a.8.8 0 0 0-.7.800v12a.8.8 0 0 0 .9.800c3.500-.2 6.300.3 8.500 1.800 2.200-1.500 5-2 8.500-1.800a.8.8 0 0 0 .9-.800v-12a.8.8 0 0 0-.7-.800C16.800 4.500 14 5 12 6.600Zm0 0v13.600"/></svg>
      </div>
      <div style="min-width:0">
        <div class="value" data-c="coursesRead"></div>
        <div class="label one-line" data-s="profile.stat.read"></div>
      </div>
    </div>
  </div>

  <!-- trophiesCard -->
  <div class="trophies" id="trophies">
    <div class="row in">
      <div>
        <div class="eyebrow" data-s="duel.trophies.title"></div>
        <div class="league one-line" data-s="duel.league.name" data-a="league"></div>
      </div>
      <div class="row count"><span data-icon="trophy"></span><span data-c="trophies"></span></div>
    </div>
  </div>

  <!-- entryCards -->
  <div class="card row poster">
    <img src="../../../../ios/Sophia/Assets.xcassets/training_poster.imageset/training_poster.jpg" alt="">
    <div class="txt"><div class="t" data-s="training.title"></div><div class="s" data-s="training.locked.tagline"></div></div>
    <svg class="ic chev" width="9" height="14" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1.500 5.500 5.500-5.500 5.500"/></svg>
  </div>
  <div class="card row poster">
    <img src="../../../../ios/Sophia/Assets.xcassets/progress_poster.imageset/progress_poster.jpg" alt="">
    <div class="txt"><div class="t" data-s="profile.progress.title"></div><div class="s" data-s="profile.progress.subtitle"></div></div>
    <svg class="ic chev" width="9" height="14" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1.500 5.500 5.500-5.500 5.500"/></svg>
  </div>

  <!-- followingSection -->
  <div class="section">
    <div class="sec-head"><h2 data-s="profile.following"></h2><span class="detail" data-c="followingCount"></span></div>
    <div class="following">
      <div class="creator"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_dusan_nikolic.jpg" alt=""><span class="one-line" data-c="creator1"></span></div>
      <div class="creator"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_stacy_jankowski.jpg" alt=""><span class="one-line" data-c="creator2"></span></div>
      <div class="creator"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_simon_lea.jpg" alt=""><span class="one-line" data-c="creator3"></span></div>
      <div class="creator"><img src="../../../../ios/Sophia/Resources/AuthorPhotos/author_ivana_toskovic.jpg" alt=""><span class="one-line" data-c="creator4"></span></div>
      <div class="creator more">
        <div class="dash">
          <svg class="ring" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.500" stroke-dasharray="4 4"><circle cx="28" cy="28" r="27.250"/></svg>
          <svg class="ic" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v14M2 9h14"/></svg>
        </div>
        <span class="one-line" data-s="training.discover"></span>
      </div>
    </div>
  </div>

  <!-- FriendsLeaderboardSection -->
  <div class="section friends">
    <div class="sec-head"><h2 data-s="profile.friends.title"></h2></div>
    <div class="pills"><div class="pill on" data-s="friends.period.week"></div><div class="pill" data-s="friends.period.all"></div></div>
    <div class="card board">
      <div class="podium">
        <div class="pcol" style="--medal:#9eabbd;--rw:2.800px">
          <div class="ring"><img class="avatar" width="56" height="56" src="../../../../ios/Sophia/Assets.xcassets/avatar_57.imageset/avatar_57.jpg" alt=""></div>
          <div class="handle me one-line" data-c="handle"></div>
          <div class="xp" data-c="xp2"></div>
          <div class="step" style="height:44px;font-size:20px">2</div>
        </div>
        <div class="pcol" style="--medal:#f2b134;--rw:3.600px">
          <!-- crown.fill -->
          <svg class="ic" width="24" height="19" viewBox="0 0 24 19" fill="#f2b134"><path d="M3.100 15.200 1.300 5.300a.9.9 0 0 1 1.400-.900l4.600 3.200 3.900-6.300a.95.95 0 0 1 1.600 0l3.900 6.300 4.600-3.200a.9.9 0 0 1 1.400.900l-1.800 9.900a1.500 1.500 0 0 1-1.500 1.200H4.600a1.500 1.500 0 0 1-1.500-1.200Z"/></svg>
          <div class="ring"><img class="avatar" width="72" height="72" src="../../../../ios/Sophia/Assets.xcassets/avatar_34.imageset/avatar_34.jpg" alt=""></div>
          <div class="handle one-line" data-c="friend1"></div>
          <div class="xp" data-c="xp1"></div>
          <div class="step" style="height:62px;font-size:22px">1</div>
        </div>
        <div class="pcol" style="--medal:#cc804f;--rw:2.800px">
          <div class="ring"><img class="avatar" width="56" height="56" src="../../../../ios/Sophia/Assets.xcassets/avatar_14.imageset/avatar_14.jpg" alt=""></div>
          <div class="handle one-line" data-c="friend3"></div>
          <div class="xp" data-c="xp3"></div>
          <div class="step" style="height:32px;font-size:20px">3</div>
        </div>
      </div>
      <div class="row lrow">
        <div class="rank">4</div>
        <img class="avatar" width="42" height="42" src="../../../../ios/Sophia/Assets.xcassets/avatar_49.imageset/avatar_49.jpg" alt="">
        <div class="handle one-line" data-c="friend4"></div>
        <div class="xp" data-c="xp4"></div>
        <svg class="ic" width="8" height="13" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1.500 5.500 5.500-5.500 5.500"/></svg>
      </div>
    </div>
    <div class="row cta">
      <!-- person -->
      <svg class="ic" width="19" height="19" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round"><circle cx="14" cy="9.500" r="4.600"/><path d="M5 23.500c.7-4.300 4.400-6.700 9-6.700s8.300 2.400 9 6.700"/></svg>
      <span data-s="friends.add.title"></span>
    </div>
    <div class="qr-row">
      <div class="card row qr">
        <!-- qrcode -->
        <svg class="ic" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linejoin="round"><rect x="2" y="2" width="6.500" height="6.500" rx="1.200"/><rect x="11.500" y="2" width="6.500" height="6.500" rx="1.200"/><rect x="2" y="11.500" width="6.500" height="6.500" rx="1.200"/><g fill="currentColor" stroke="none"><rect x="4.300" y="4.300" width="1.900" height="1.900"/><rect x="13.800" y="4.300" width="1.900" height="1.900"/><rect x="4.300" y="13.800" width="1.900" height="1.900"/><rect x="11" y="11" width="2.600" height="2.600"/><rect x="15.900" y="11" width="2.600" height="2.600"/><rect x="13.450" y="13.450" width="2.600" height="2.600"/><rect x="11" y="15.900" width="2.600" height="2.600"/><rect x="15.900" y="15.900" width="2.600" height="2.600"/></g></svg>
        <span data-s="profile.qr.mine"></span>
      </div>
      <div class="card row qr">
        <!-- qrcode.viewfinder -->
        <svg class="ic" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="M1.500 6V3.500a2 2 0 0 1 2-2H6M14 1.500h2.500a2 2 0 0 1 2 2V6M18.500 14v2.500a2 2 0 0 1-2 2H14M6 18.500H3.500a2 2 0 0 1-2-2V14"/><g fill="currentColor" stroke="none"><rect x="5.500" y="5.500" width="3.600" height="3.600" rx=".6"/><rect x="10.900" y="5.500" width="3.600" height="3.600" rx=".6"/><rect x="5.500" y="10.900" width="3.600" height="3.600" rx=".6"/><rect x="10.900" y="10.900" width="1.600" height="1.600"/><rect x="12.900" y="12.900" width="1.600" height="1.600"/></g></svg>
        <span data-s="profile.qr.scan"></span>
      </div>
    </div>
  </div>

  <!-- badgesSection -->
  <div class="section">
    <div class="sec-head"><h2 data-s="profile.badges"></h2>
      <div class="link"><span data-s="badges.seeAll"></span><svg class="ic" width="7" height="11" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1.500 5.500 5.500-5.500 5.500"/></svg></div>
    </div>
    <div class="badges">
      <div class="card badge"><img src="../../../../ios/Sophia/Assets.xcassets/badge_streak_7.imageset/badge_streak_7.jpg" alt=""><span data-s="badge.name.streak_7"></span></div>
      <div class="card badge"><img src="../../../../ios/Sophia/Assets.xcassets/badge_courses_10.imageset/badge_courses_10.jpg" alt=""><span data-s="badge.name.courses_10"></span></div>
      <div class="card badge"><img src="../../../../ios/Sophia/Assets.xcassets/badge_subject_art.imageset/badge_subject_art.jpg" alt=""><span data-s="badge.name.subject_art"></span></div>

  <!-- listsSection -->

    <div class="pills fills">
      <div class="pill on" data-s="profile.list.toRead" data-suffix="toReadCount"></div>

      <div class="pill" data-s="profile.list.liked" data-suffix="likedCount"></div>

    <div class="card row course">

      <div style="min-width:0"><div class="t" data-c="course1.title"></div><div class="m one-line"><span data-c="course1.author"></span> · <span data-s="common.minutesShort" data-a="course1.minutes"></span></div></div>

    <div class="card row course">
      <img src="../../../../ios/Sophia/CourseImages/fresh_coriander_cilantro_bunch_leaves.jpg" alt="">
      <div style="min-width:0"><div class="t" data-c="course2.title"></div><div class="m one-line"><span data-c="course2.author"></span> · <span data-s="common.minutesShort" data-a="course2.minutes"></span></div></div>
    </div>
  </div>

  <!-- secondaryPages -->
  <div class="card row poster">
    <img src="../../../../ios/Sophia/Assets.xcassets/antiscroll_poster.imageset/antiscroll_poster.jpg" alt="">
    <div class="txt"><div class="t" data-s="profile.page.antiScroll"></div><div class="s" data-s="tiktokBlocker.card.off.subtitle"></div></div>
    <svg class="ic chev" width="9" height="14" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="m1.500 1.500 5.500 5.500-5.500 5.500"/></svg>
  </div>

</div></div>

// French typography: no-break space before ? ! : ;
const typo = (t) => t.replace(/ ([?!:;])/g, " $1");
document.querySelectorAll("[data-c]").forEach((el) => { el.innerHTML = typo(C[el.dataset.c]); });
document.querySelectorAll("[data-s]").forEach((el) => {
  let t = S[el.dataset.s];
  if (el.dataset.a) t = t.replace(/%@|%d/, C[el.dataset.a]);          // String(format:)
  if (el.hasAttribute("data-lower")) t = t.toLocaleLowerCase("fr");   // .lowercased()
  if (el.dataset.suffix) t += " · " + C[el.dataset.suffix];           // "À lire · 2"
  el.innerHTML = typo(t);
});
